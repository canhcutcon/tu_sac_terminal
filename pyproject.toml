[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tusac-terminal"
version = "1.0.0"
description = "Tứ Sắc trong terminal: 1 người + 3 bot, luật cấu hình được, chế độ học luật."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["rich>=13"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
tusac = "tusac.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
